# --- I-MAPPO specific parameters ---

runner: "episode"
mac: "basic_mac"
learner: "imappo_learner"
name: "imappo"

lr: 0.0003
critic_lr: 0.0003
potential_lr: 0.0003
potential_update_mode: "normal"
potential_update_interval: 4

gamma: 0.99
gae_lambda: 0.95
eps_clip: 0.1
eta: 0.5
eta_end: 0.1
entropy_coef: 0.001
entropy_coef_end: 0.0001
value_coef: 0.5
value_clip: 0.2
grad_norm_clip: 0.5
epochs: 4

batch_size: 128
rollout_length: 512
max_episodes: 100

intent_dim: 8
intent_source: "onehot"
intent_library_path: ""
intent_encoder_model: "sentence-transformers/all-MiniLM-L6-v2"
intent_encoder_revision: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
intent_encoder_batch_size: 32
intent_projection_seed: 0
intent_code_seed: 0
intent_encoder_device: ""
imappo_n_agents: 8
imappo_n_targets: 6
imappo_obs_dim: 30
imappo_state_dim: 240
imappo_action_dim: 3

action_low: -1.0
action_high: 1.0

standardise_returns: False
standardise_rewards: False

use_rnn: False
agent_output_type: "continuous_gaussian"
